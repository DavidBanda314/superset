suite: WebSocket Config Secret Tests
templates:
  - secret-ws.yaml

tests:
  - it: should fail rendering when jwtSecret is not set
    set:
      supersetWebsockets.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: supersetWebsockets.config.jwtSecret must be set to a strong, unique value when supersetWebsockets.enabled is true. It signs the async-query JWTs and must match GLOBAL_ASYNC_QUERIES_JWT_SECRET in the Superset config.

  - it: should fail rendering when jwtSecret is left as the CHANGE-ME placeholder
    set:
      supersetWebsockets.enabled: true
      supersetWebsockets.config.jwtSecret: "CHANGE-ME"
    asserts:
      - failedTemplate:
          errorMessage: supersetWebsockets.config.jwtSecret must be set to a strong, unique value when supersetWebsockets.enabled is true. It signs the async-query JWTs and must match GLOBAL_ASYNC_QUERIES_JWT_SECRET in the Superset config.

  - it: should render the config secret when jwtSecret is provided
    set:
      supersetWebsockets.enabled: true
      supersetWebsockets.config.jwtSecret: "test-secret-for-unit-test"
    asserts:
      - isKind:
          of: Secret
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"jwtSecret":"test-secret-for-unit-test"'
