# gitleaks configuration used by the `gitleaks` pre-commit hook.
# Keeps gitleaks' built-in rule set and adds a rule for the telemetry
# ingest credential family (see issue #185), whose generic
# `telemetry-<env>-<hex>` format is not matched by the default rules.

title = "Apache Superset gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "superset-telemetry-api-key"
description = "Telemetry ingest API key (telemetry-<env>-<hex>)"
regex = '''telemetry-(?:prod|staging|stage|dev|test)-[0-9a-f]{16,}'''
tags = ["key", "telemetry"]
