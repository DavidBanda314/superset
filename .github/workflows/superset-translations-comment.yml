name: Translation Regression Comment

on:
  # zizmor: ignore[dangerous-triggers] - runs in base-branch context and only consumes the uploaded artifact; never checks out PR code (see note below)
  workflow_run:
    workflows: ["Translations"]
    types: [completed]

# This workflow posts a PR comment when the Translations workflow detects a
# regression. It uses the workflow_run trigger so that it always runs in the
# base-branch context and can safely be granted write permissions, even for
# PRs from forks.
#
# IMPORTANT: This workflow must NEVER check out code from the PR branch, and
# must never trust artifact contents. The artifact is produced by a
# pull_request-triggered workflow that runs PR-controlled code, so it is
# attacker-controlled: the target PR number is resolved from the trusted
# workflow_run event payload, and the report body is sanitized and fenced
# before being posted.

permissions:
  pull-requests: write
  actions: read

jobs:
  post-comment:
    runs-on: ubuntu-24.04
    # Only act when the Translations workflow failed (which means a regression
    # was detected — the workflow exits 1 on regression).
    if: github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: Download regression artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: translation-regression
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/translation-regression

      - name: Post or update PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            const reportFile = '/tmp/translation-regression/regression-report.md';

            if (!fs.existsSync(reportFile)) {
              console.log('Artifact report not found, skipping comment.');
              return;
            }

            // Resolve the target PR from the trusted event payload only — never
            // from the (attacker-controlled) artifact.
            const run = context.payload.workflow_run;
            const headSha = run.head_sha;
            let prNumber = (run.pull_requests || [])
              .filter(pr => pr.head && pr.head.sha === headSha)
              .map(pr => pr.number)[0];

            if (!prNumber) {
              // Fork PRs are not listed in workflow_run.pull_requests, so look
              // the PR up by its head repo/branch and verify the head SHA.
              const headRepo = run.head_repository;
              if (!headRepo || !run.head_branch) {
                console.log('No head repository/branch on the triggering run, skipping comment.');
                return;
              }
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${headRepo.owner.login}:${run.head_branch}`,
                per_page: 100,
              });
              const match = pulls.find(
                pr =>
                  pr.head.sha === headSha &&
                  pr.head.repo &&
                  pr.head.repo.full_name === headRepo.full_name,
              );
              if (!match) {
                console.log(`No open PR matches head SHA ${headSha}, skipping comment.`);
                return;
              }
              prNumber = match.number;
            }

            // Treat the report as untrusted data: cap its size, neutralize HTML
            // comments, @-mentions and code fences, then wrap it in a fenced
            // block so it cannot forge markers or instructions to other bots.
            const MAX_REPORT_BYTES = 20000;
            let report = fs.readFileSync(reportFile, 'utf8');
            let truncated = false;
            if (report.length > MAX_REPORT_BYTES) {
              report = report.slice(0, MAX_REPORT_BYTES);
              truncated = true;
            }
            report = report
              .replace(/\r/g, '')
              .replace(/`/g, "'")
              .replace(/<!--/g, '&lt;!--')
              .replace(/-->/g, '--&gt;')
              .replace(/@/g, '@\u200b');
            if (truncated) {
              report += '\n[report truncated]';
            }

            const marker = '<!-- translation-regression-bot -->';
            const body = [
              marker,
              'Translation regression detected by the Translations workflow ' +
                `(commit ${headSha}). Untrusted report output:`,
              '```text',
              report,
              '```',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated existing comment ${existing.id} on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              console.log(`Created new comment on PR #${prNumber}`);
            }
