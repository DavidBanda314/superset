# Copy this file to .github/workflows/devin-dispatch.yml in the TARGET fork
# (issue events are only delivered to the repo where the issues live).
name: devin-dispatch

on:
  issues:
    types: [opened, labeled]

jobs:
  dispatch:
    # Only react to the 'labeled' event for the remediation label: issues
    # created with the label emit both 'opened' and 'labeled', so gating on a
    # single event type prevents duplicate dispatches.
    if: github.event.action == 'labeled' && github.event.label.name == 'devin-fix'
    concurrency:
      group: devin-dispatch-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # Defence in depth: the label is a privileged trigger that spends
      # DEVIN_SERVICE_API_KEY, so the actor that applied it must have write
      # access even if some other workflow path allowed the label to be set.
      - name: Security Check - Authorize Maintainers Only
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const actor = context.actor;
            let level = 'none';
            try {
              const { data: permission } =
                await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: actor,
                });
              level = permission.permission;
            } catch (error) {
              core.info(`Could not resolve permissions for ${actor}: ${error.message}`);
            }
            if (!['write', 'admin'].includes(level)) {
              core.setFailed(
                `Unauthorized: ${actor} has '${level}' access; applying the ` +
                  "'devin-fix' label requires write or admin access.",
              );
            }

      - name: Checkout automation scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.1
        with:
          repository: DavidBanda314/devin-workflows
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Dispatch Devin fix session
        env:
          DEVIN_SERVICE_API_KEY: ${{ secrets.DEVIN_SERVICE_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          PYTHONPATH: scripts
        run: python scripts/dispatch.py
