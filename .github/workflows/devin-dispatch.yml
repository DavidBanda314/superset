# Copy this file to .github/workflows/devin-dispatch.yml in the TARGET fork
# (issue events are only delivered to the repo where the issues live).
name: devin-dispatch

on:
  issues:
    types: [opened, labeled]

jobs:
  dispatch:
    # Only react to the 'labeled' event for the remediation label: issues
    # created with the label emit both 'opened' and 'labeled', so gating on a
    # single event type prevents duplicate dispatches.
    if: github.event.action == 'labeled' && github.event.label.name == 'devin-fix'
    concurrency:
      group: devin-dispatch-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.1
        with:
          repository: DavidBanda314/devin-workflows
          # Pin the external automation repo to an immutable commit SHA: this
          # code executes in a job holding DEVIN_SERVICE_API_KEY and
          # GITHUB_TOKEN, so it must be bumped deliberately via PR and never
          # tracked by branch name.
          ref: eee28ab7ee5ac3ea38b4df47e5f4a6ae89e1f62b # main @ 2026-08-07
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Dispatch Devin fix session
        env:
          DEVIN_SERVICE_API_KEY: ${{ secrets.DEVIN_SERVICE_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          PYTHONPATH: scripts
        run: python scripts/dispatch.py
